<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173763" />
    <title>统一期权面板</title>
    <link rel="stylesheet" href="./styles.css?v=20260927-app1" />
  </head>
  <body>
    <div id="app">
      <nav class="market-tabs" aria-label="市场切换"></nav>
      <header class="hero">
        <div class="hero-main">
          <h1 id="title">期权看板</h1>
          <div class="quote">
            <span data-quote-symbol>—</span>：<strong data-quote-price
              >—</strong
            >
          </div>
        </div>
        <section class="status" aria-label="数据状态">
          <div id="marketStatusItem">
            <span>市场状态</span><b id="marketStatus">未确认</b>
          </div>
          <div><span>数据时间</span><b id="dataTime">—</b></div>
          <div><span>下次刷新</span><b id="countdown">—</b></div>
          <div>
            <span>校对状态</span><b id="health" data-tone="unknown">等待校对</b>
          </div>
        </section>
        <div class="themes" role="group" aria-label="颜色主题">
          <button data-theme="light" aria-label="浅色主题">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg></button
          ><button data-theme="dark" aria-label="深色主题">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z" />
            </svg>
          </button>
        </div>
      </header>
      <main>
        <aside class="floating-quote" aria-label="当前行情">
          <span data-quote-symbol>—</span><strong data-quote-price>—</strong>
        </aside>
        <div id="symbolBar" class="symbol-bar" hidden>
          <label
            >自选股票
            <select id="symbolSelect"></select
          ></label>
        </div>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="pending" class="pending" hidden>
          已获取新行情，操作结束后更新
        </div>
        <nav class="tabs" aria-label="视图切换">
          <button data-view="chain" class="active">期权链</button
          ><button data-view="price">价格年化</button
          ><button data-view="ranking">年化排行</button>
        </nav>
        <section class="panel" data-panel="chain">
          <div class="expiry-row">
            <div class="picker">
              <button
                id="expiryTrigger"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span id="expiryValue">—</span><span>▼</span>
              </button>
              <div
                id="expiryMenu"
                class="picker-menu"
                role="listbox"
                hidden
              ></div>
            </div>
            <p id="expiryDetail">—</p>
          </div>
          <div id="expiryButtons" class="expiry-buttons"></div>
          <div class="table-wrap chain-wrap">
            <table class="chain-table">
              <thead>
                <tr>
                  <th>行权概率</th>
                  <th>
                    <span class="desktop-label">单期收益率</span
                    ><span class="mobile-label">单期收益</span>
                  </th>
                  <th>Covered Call<br />年化</th>
                  <th class="sticky-strike">行权价</th>
                  <th>Sell Put<br />年化</th>
                  <th>
                    <span class="desktop-label">单期收益率</span
                    ><span class="mobile-label">单期收益</span>
                  </th>
                  <th>行权概率</th>
                </tr>
              </thead>
              <tbody id="chainBody"></tbody>
            </table>
          </div>
        </section>
        <section class="panel" data-panel="price" hidden>
          <div class="controls">
            <div id="priceSides" class="segments">
              <button data-price-side="CALL">Call</button
              ><button data-price-side="PUT">Put</button>
            </div>
            <p id="currentStrikeLabel" class="current-strike">
              当前行权价：<b id="currentStrike">—</b>
            </p>
            <div class="picker strike-picker">
              <button
                id="strikeTrigger"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span id="strikeValue">—</span><span>▼</span>
              </button>
              <div
                id="strikeMenu"
                class="picker-menu"
                role="listbox"
                hidden
              ></div>
            </div>
          </div>
          <div
            id="strikeGroupButtons"
            class="strike-groups"
            aria-label="行权价分组"
          ></div>
          <div
            id="strikeButtons"
            class="strike-options"
            aria-label="行权价"
          ></div>
          <div class="table-wrap">
            <table class="price-table">
              <thead id="priceHead">
                <tr>
                  <th>
                    <button data-sort="expiry">
                      到期日 <span class="arrow"></span>
                    </button>
                  </th>
                  <th>
                    <button data-sort="annualized_pct">
                      <span id="priceAnnualLabel">参考年化</span>
                      <span class="arrow"></span>
                    </button>
                  </th>
                  <th>
                    <button data-sort="period_return_pct">
                      <span class="desktop-label">单期收益率</span
                      ><span class="mobile-label">单期收益</span>
                      <span class="arrow"></span>
                    </button>
                  </th>
                  <th>
                    <button data-sort="exercise_probability_pct">
                      行权概率 <span class="arrow"></span>
                    </button>
                  </th>
                  <th>
                    <button data-sort="remaining_seconds">
                      剩余时间 <span class="arrow"></span>
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody id="priceBody"></tbody>
            </table>
          </div>
        </section>
        <section class="panel" data-panel="ranking" hidden>
          <div class="controls ranking-controls">
            <div id="rankingSides" class="segments">
              <button data-ranking-side="CALL">Call</button
              ><button data-ranking-side="PUT">Put</button>
            </div>
            <div id="rankingRanges" class="segments ranges">
              <button data-range="LT3">&lt;3天</button
              ><button data-range="3_7">3-7天</button
              ><button data-range="7_30">7-30天</button
              ><button data-range="30_60">30-60天</button
              ><button data-range="GT60">&gt;60天</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="ranking-table">
              <thead id="rankingHead">
                <tr id="rankingHeadRow"></tr>
              </thead>
              <tbody id="rankingBody"></tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="rankingPrev">&lt;</button><span id="rankingPages"></span
            ><button id="rankingNext">&gt;</button>
          </div>
        </section>
      </main>
      <footer>
        <a id="footer" target="_blank" rel="noopener noreferrer"></a>
      </footer>
    </div>
    <script type="module" src="./main.js?v=20260927-app1"></script>
  </body>
</html>
