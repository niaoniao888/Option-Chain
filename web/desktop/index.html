<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BTC 期权看板</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../shared/guide.css">
  <link rel="stylesheet" href="../shared/period-return.css">
  <link rel="stylesheet" href="../../shared/market-shell.css">
</head>
<body>
  <nav class="market-tabs" aria-label="市场切换"><a class="active" aria-current="page" href="./">BTC 期权看板</a><a href="../../us-equities/desktop/">美股期权看板</a></nav>
  <header class="hero">
    <div class="hero-summary"><h1>BTC 期权看板</h1>
    <section class="hero-status" aria-label="数据状态">
      <div><span>数据时间</span><b id="fetchedAt">等待数据</b></div>
      <div><span>下次刷新</span><b id="countdown">—</b></div>
      <div><span>校对状态</span><b id="health" class="pill">加载中</b></div>
    </section>
    </div>
    <div class="hero-tools">
      <div class="theme-switcher" role="group" aria-label="页面颜色主题">
        <button type="button" data-theme-choice="light" aria-pressed="true">浅色</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">深色</button>
      </div>
    </div>
  </header>
  <main>

    <section id="notice" class="notice hidden" role="alert"></section>

    <nav class="tabs" aria-label="视图切换">
      <button class="tab active" data-view="chain">期权链</button>
      <button class="tab" data-view="price">价格年化</button>
      <button class="tab" data-view="ranking">年化排行</button>
      <button class="tab" data-view="guide">期权说明</button>
    </nav>

    <section id="chainView" class="panel">
      <div class="panel-head"><div><p id="expiryDetail" class="expiry-detail">—</p></div></div>
      <div class="expiry-control"><div id="expiryButtons" class="expiry-buttons" role="group" aria-label="到期日"></div></div>
      <div class="table-wrap chain-scroll"><table class="chain-table"><colgroup><col class="metric-prob"><col class="metric-period"><col class="metric-annual"><col class="metric-strike"><col class="metric-annual"><col class="metric-period"><col class="metric-prob"></colgroup><thead><tr><th class="call-side probability-column">行权概率</th><th class="call-side period-column">单期收益率</th><th class="call-side annual-column">Covered Call 年化</th><th class="strike-cell">行权价</th><th class="put-side annual-column">Sell Put 年化</th><th class="put-side period-column">单期收益率</th><th class="put-side probability-column">行权概率</th></tr></thead><tbody id="chainBody"></tbody></table></div>
    </section>

    <section id="priceView" class="panel hidden">
      <div class="price-controls">
        <div class="price-toolbar"><div class="filter-group"><div id="priceSideFilter" class="segmented-filter price-side-filter" role="group" aria-label="价格年化方向"><button type="button" aria-pressed="true" data-value="CALL">Call</button><button type="button" aria-pressed="false" data-value="PUT">Put</button></div></div><p id="currentStrikeLabel" class="current-strike">当前行权价：<b id="currentStrike">—</b></p></div>
        <div class="strike-picker"><div id="strikeGroupButtons" class="strike-group-buttons" role="group" aria-label="行权价区间"></div><div id="strikeButtons" class="strike-buttons" role="group" aria-label="具体行权价"></div></div>
      </div>
      <div class="table-wrap price-scroll"><table class="price-yield-table"><colgroup><col class="price-date"><col class="metric-annual"><col class="metric-period"><col class="metric-prob"><col class="price-remaining"></colgroup><thead><tr><th>到期日</th><th id="priceAnnualHead"><span class="nowrap-label">Covered Call</span><br>年化</th><th>单期收益率</th><th>行权概率</th><th>剩余时间</th></tr></thead><tbody id="priceYieldBody"></tbody></table></div>
    </section>

    <section id="rankingView" class="panel hidden">
      <div id="filters" class="filters">
        <div class="filter-group"><div id="sideFilter" class="segmented-filter" role="group" aria-label="方向"><button type="button" aria-pressed="true" data-value="CALL">Call</button><button type="button" aria-pressed="false" data-value="PUT">Put</button></div></div>
        <div class="filter-group"><div id="expiryRange" class="segmented-filter" role="group" aria-label="期限"><button type="button" aria-pressed="true" data-value="LT3">&lt;3天</button><button type="button" aria-pressed="false" data-value="3_7">3-7天</button><button type="button" aria-pressed="false" data-value="7_30">7-30天</button><button type="button" aria-pressed="false" data-value="30_60">30-60天</button><button type="button" aria-pressed="false" data-value="GT60">&gt;60天</button></div></div>
      </div>
      <div class="table-wrap ranking-scroll"><table class="ranking-table"><colgroup><col class="rank-date"><col class="rank-strike"><col class="metric-period"><col class="rank-annual"><col class="metric-prob"></colgroup><thead id="rankingHead"><tr><th aria-sort="none"><button type="button" class="sort-button" data-sort="expiry_ms">到期日<span class="sort-arrow"></span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="strike">行权价<span class="sort-arrow"></span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="period_return_pct">单期收益率<span class="sort-arrow"></span></button></th><th aria-sort="descending"><button type="button" class="sort-button" data-sort="annualized_pct">年化<span class="sort-arrow">▼</span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="exercise_probability_pct">行权概率<span class="sort-arrow"></span></button></th></tr></thead><tbody id="rankingBody"></tbody></table></div>
      <div class="ranking-pagination" aria-label="排行分页"><button type="button" id="rankingPrev" class="page-arrow" aria-label="上一页">&lt;</button><div id="rankingPages" class="ranking-pages"></div><button type="button" id="rankingNext" class="page-arrow" aria-label="下一页">&gt;</button></div>
    </section>

    <section id="guideView" class="panel guide-view hidden" data-guide-mode="readonly" aria-labelledby="guideTitle">
      <div class="guide-head">
        <div><h2 id="guideTitle">期权说明</h2><p id="guideMeta" class="guide-meta">打开本页后加载</p></div>
      </div>
      <p id="guideMessage" class="guide-message" role="status" aria-live="polite"></p>
      <div id="guideContent" class="guide-content"></div>
    </section>
  </main>
  <footer>数据来源：币安（<a href="https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-options/api/rest-api/market-data" target="_blank" rel="noopener noreferrer">Binance Options EAPI</a>）</footer>
  <div class="price-card" aria-label="当前 BTC/USDT"><span>BTC/USDT</span><strong id="indexPrice">—</strong></div>
  <script src="../shared/guide.js" defer></script>
  <script src="../shared/period-return.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
