# Include inside your existing HTTPS server block.
# The Python app must have OPTIONS_BASE_PATH=/options.
# Add the real public hostname to OPTIONS_ALLOWED_HOSTS.
location = /options {
    return 308 /options/;
}
location /options/ {
    # No trailing slash: preserve /options/... in the upstream request.
    proxy_pass http://127.0.0.1:8780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    # A stale quote must remain identifiable. Do not enable long API/CDN caches.
    proxy_cache off;
}
