name: options-panel-tests
on:
  push:
    branches: ["**"]
    tags: ["linux-*"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      OPTIONS_COLLECTOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.js
      - run: node tests/test_bootstrap.js
  container-build:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/package_release.py
      - run: |
          mkdir extracted
          tar -xzf dist/*-linux.tar.gz -C extracted
          cd extracted/options-panel
          ./scripts/ci_container_runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: dist/
          if-no-files-found: error

  browser-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OPTIONS_COLLECTOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements-dev.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/linux-')
    needs: [tests, container-build, browser-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-bundle
          path: dist
      - name: Verify tag and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha=$(git rev-parse --short=8 HEAD)
          version=$(python -c 'import json,glob; print(json.load(open(glob.glob("dist/*-FILE-MANIFEST.json")[0], encoding="utf-8"))["version"])')
          expected_tag="linux-$version-$short_sha"
          [ "$GITHUB_REF_NAME" = "$expected_tag" ] || { echo "tag must equal $expected_tag" >&2; exit 1; }
          grep -q '"git_commit": "'"$short_sha"'"' dist/*-FILE-MANIFEST.json
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
