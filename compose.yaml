services:
  options-panel:
    build: .
    image: options-panel:2.0.0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${OPTIONS_PORT:-8780}:8780"
    environment:
      OPTIONS_BASE_PATH: "${OPTIONS_BASE_PATH:-/options}"
      OPTIONS_ALLOWED_HOSTS: "${OPTIONS_ALLOWED_HOSTS:-127.0.0.1,localhost}"
    volumes:
      - panel-runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:8780'+os.environ.get('OPTIONS_BASE_PATH','')+'/healthz',timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  panel-runtime:
